image: ${REGISTRY_DOCKER_URL}/stackstate/stackstate-agent-integrations-runner:${RUNNER_IMAGE_TAG}
stages:
  - build
  - test
  - publish

variables:
  CONDA_ENV: "stackstate-agent-integrations-py-3"
  PYTHON_VERSION: 3.13.14
  RUNNER_IMAGE_TAG: "20260625-py313"

.rules:
  - &pull_requests
    if: $CI_EXTERNAL_PULL_REQUEST_IID
  - &base_changes
    if: $CI_EXTERNAL_PULL_REQUEST_IID
    changes:
      - stackstate_checks_base/*
      - stackstate_checks_base/**/*
      - stackstate_checks_dev/*
      - stackstate_checks_dev/**/*
      - stackstate_checks_tests_helper/*
      - stackstate_checks_tests_helper/**/*
      - .gitlab-ci.yml
      - $CHECK/*
      - $CHECK/**/*
  - &master_branch
    if: '$CI_COMMIT_BRANCH == "stackstate-7.78.2"'
  - &release_branch
    if: $CI_COMMIT_TAG
  - &base_manual_changes

    if: $CI_EXTERNAL_PULL_REQUEST_IID
    changes:
      - stackstate_checks_base/*
      - stackstate_checks_base/**/*
      - stackstate_checks_dev/*
      - stackstate_checks_dev/**/*
      - stackstate_checks_tests_helper/*
      - stackstate_checks_tests_helper/**/*
      - .gitlab-ci.yml
      - $CHECK/*
      - $CHECK/**/*
    when: manual
    allow_failure: true
  - &splunk_base_build_rule
    if: $CI_EXTERNAL_PULL_REQUEST_IID
    changes:
      - splunk_base/*
      - splunk_base/**/*
  - &master_manual_branch
    if: '$CI_COMMIT_BRANCH == "stackstate-7.78.2"'
    when: manual
    allow_failure: true
  - &release_manual_branch
    if: $CI_COMMIT_TAG
    when: manual
    allow_failure: true

.base_integration_rules:
  &base_integration_rules
  rules:
    - <<: *base_changes
    - <<: *master_branch
    - <<: *release_branch

.base_splunk_integration_rules:
  &base_splunk_integration_rules
  rules:
    - <<: *base_changes
    - <<: *master_branch
    - <<: *release_branch
    - <<: *splunk_base_build_rule

.base_integration_manual_rules:
  &base_integration_manual_rules
  rules:
    - <<: *base_manual_changes
    - <<: *master_manual_branch
    - <<: *release_manual_branch

.base_job_rules:
  &base_job_rules
  rules:
    - <<: *pull_requests
    - <<: *master_branch
    - <<: *release_branch

.manual_job_rules:
  &manual_job_rules
  rules:
    - <<: *pull_requests
      when: manual
      allow_failure: true
    - <<: *master_branch
      when: manual
      allow_failure: true
    - <<: *release_branch
      when: manual
      allow_failure: true

.linux_env: &linux_env
  before_script:
    - source .setup-scripts/setup_env.sh

.windows_env: &windows_env
  tags:
    - windows_agent7_ps1
  before_script:
    - Import-Module C:\tools\miniconda3\shell\condabin\conda-hook.ps1
    - ./.setup-scripts/conda_env.ps1 $CONDA_ENV $PYTHON_VERSION
    - conda activate $CONDA_ENV
    - python -m pip install .\stackstate_checks_dev[cli]

print_env:
  <<: *linux_env
  <<: *manual_job_rules
  stage: build
  script:
    - printenv
  interruptible: true

docker:
  image: ${REGISTRY_DOCKER_URL}/library/docker:20-git
  stage: build
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /Build new docker image/i
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .setup-scripts/image/**/*
        - .setup-scripts/setup_env.sh
      when: manual
      allow_failure: true
    - if: $CI_EXTERNAL_PULL_REQUEST_IID
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "stackstate-7.78.2"'
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  script:
    - echo "${docker_password}" | docker login --username=${docker_user} --password-stdin docker.io
    - echo "${quay_password}" | docker login --username=${quay_user} --password-stdin quay.io
    - echo "${REGISTRY_PASSWORD}" | docker login --username=${REGISTRY_USER} --password-stdin ${REGISTRY_HOST}
    - apk add make
    - cd .setup-scripts/image
    # Pull base from docker.io during build; mirror may not have 3.13.14-bookworm yet.
    - make build push PYTHON_BASE_IMAGE=python:3.13.14-bookworm
    - RUNNER_TAG=$(make -s print_tag)
    - echo "Published ${REGISTRY_DOCKER_URL}/stackstate/stackstate-agent-integrations-runner:${RUNNER_TAG}"
    - echo "Set RUNNER_IMAGE_TAG to ${RUNNER_TAG} (setup_env.sh/conda_env.ps1 already target python3.13/3.13.14), then re-run the pipeline."
    - |
      if [ "${CI_COMMIT_REF_NAME}" = "stackstate-7.78.2" ]; then
        make tag_latest push_latest
      fi
  services:
    - alias: docker
      command:
        - --experimental
        - --tls=false
      name: ${REGISTRY_DOCKER_URL}/library/docker:20-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""


linux_deps:
  <<: *linux_env
  <<: *base_job_rules
  stage: build
  interruptible: true
  script:
    - source .setup-scripts/load_deps.sh
  artifacts:
    paths:
      - venv/
    expire_in: 1 week

.linux_test: &linux_test
  <<: *linux_env
  <<: *base_integration_rules
  stage: test
  needs:
    - linux_deps
  services:
    - alias: docker
      command:
        - --experimental
        - --tls=false
      name: ${REGISTRY_DOCKER_URL}/library/docker:24-dind
  script:
    - .setup-scripts/setup_artifact_registry.sh
    - .setup-scripts/setup_artifactory_docker.sh
    - export COMPOSE_HTTP_TIMEOUT=300 # Increase timeout in case containers are slow to start up.
    - checksdev test --cov ${CHECK}
    - checksdev test ${CHECK} --bench || true
      # [BS] we skip this until https://github.com/PyCQA/pylint/pull/2681/commits/253e5d05e3943d3bc8e4470804a138cb20049548 lands in pylint stable version
      # - if [ -n "$PYTHON3" ]; then checksdev validate py3 ${CHECK}; fi
  interruptible: true

.linux_splunk_test: &linux_splunk_test
  <<: *linux_test
  <<: *base_splunk_integration_rules
  script:
    - .setup-scripts/setup_artifact_registry.sh
    - .setup-scripts/setup_artifactory_docker.sh
    - docker pull registry.tooling.stackstate.io/docker/splunk/splunk:latest # Pull splunk to aovid pulling during compose, which breaks in python
    - export COMPOSE_HTTP_TIMEOUT=300 # Increase timeout in case splunk is slow to start up.
    - checksdev test --cov ${CHECK}
    - checksdev test ${CHECK} --bench || true
      # [BS] we skip this until https://github.com/PyCQA/pylint/pull/2681/commits/253e5d05e3943d3bc8e4470804a138cb20049548 lands in pylint stable version
    # - if [ -n "$PYTHON3" ]; then checksdev validate py3 ${CHECK}; fi

test_stackstate_checks_base:
  <<: *linux_test
  variables:
    CHECK: "stackstate_checks_base"
    PYTHON3: "true"
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
  script:
    - checksdev validate config
    - checksdev validate dep
    - checksdev validate manifest --include-extras
    - checksdev validate metadata
    - checksdev validate service-checks
    - checksdev test --cov ${CHECK}
    - checksdev test ${CHECK} --bench || true

