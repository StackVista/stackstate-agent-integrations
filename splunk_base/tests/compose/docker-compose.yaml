version: '3'
services:
  splunk:
    image: "registry.tooling.stackstate.io/docker/splunk/splunk:latest"
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: admin12345
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
    ports:
      - 8000:8000
      - 8089:8089
