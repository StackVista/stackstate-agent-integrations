[tox]
minversion = 2.0
basepython = py3
envlist =
    {py3}-{unit,integration}
    flake8

[testenv]
pip_version = pip==25.3
usedevelop = true
platform = linux|darwin|win32
deps =
    -e../stackstate_checks_base[deps]
    -rrequirements-dev.txt
passenv =
    DOCKER*
    COMPOSE*
setenv =
    STSDEV_TESTING_PLUGIN=true
commands =
    pip install -r requirements.in
    {py3}-unit: pytest -v -p no:warnings -m"unit"
    {py3}-integration: pytest -v -p no:warnings -m"integration"

[testenv:flake8]
skip_install = true
deps = flake8 <= 4.0.1
commands = flake8 .

[flake8]
ignore = F401,F403,W504,W503
exclude = .eggs,.tox,build
max-line-length = 120
