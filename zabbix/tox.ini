[tox]
minversion = 2.0
skip_missing_interpreters = true
basepython = py3
envlist =
    {py3}-zabbix
    flake8

[testenv]
pip_version = pip==24.3.1
usedevelop = true
platform = linux|darwin|win32
deps =
    -e../stackstate_checks_base[deps]
    -rrequirements-dev.txt
passenv =
    DOCKER*
    COMPOSE*
commands =
    pip install -r requirements.in
    pytest -v

[testenv:flake8]
skip_install = true
deps = flake8 >= 7.0
commands = flake8 --config tox.ini .

[flake8]
ignore = E275,E721
exclude = .eggs,.tox,build
max-line-length = 120
