[tox]
minversion = 2.0
basepython = py3
envlist =
    {py3}-{unit,integration}
    flake8

[pytest]
addopts = --strict-markers
markers =
    integration
    unit

[testenv]
pip_version = pip==23.3.1
usedevelop = true
platform = linux|darwin|win32
passenv =
    DOCKER*
    COMPOSE*
deps =
    setuptools<78
    -e../stackstate_checks_base[deps]
    -e../splunk_base[deps]
    -rrequirements-dev.txt
commands =
    {py3}-unit: pytest -v --log-cli-level=DEBUG tests -m"unit"
    {py3}-integration: pytest tests -m"integration"

[testenv:flake8]
skip_install = true
deps = flake8 >= 7.0
commands = flake8 --config tox.ini .

[flake8]
ignore = F401
exclude = .eggs,.tox,build
max-line-length = 120
