name: Cerberus notify

on:
  workflow_call:
    inputs:
      suite:
        description: Suite label shown in the Slack message, e.g. checks.
        required: true
        type: string
    secrets:
      CERBERUS_LAMBDA_URL:
        required: false
      CERBERUS_API_TOKEN:
        required: false

permissions: {}

jobs:
  notify:
    name: Notify Slack via Cerberus
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post the failure to Cerberus
        env:
          CERBERUS_LAMBDA_URL: ${{ secrets.CERBERUS_LAMBDA_URL }}
          CERBERUS_API_TOKEN: ${{ secrets.CERBERUS_API_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PIPELINE: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail

          # Fail closed (STAC-25555). Naming the individual secret matters: the
          # two are provisioned together, so exactly one missing means drift or a
          # partial apply rather than a repo that was never wired up.
          missing=""
          if [ -z "${CERBERUS_LAMBDA_URL}" ]; then
            missing="CERBERUS_LAMBDA_URL"
          fi
          if [ -z "${CERBERUS_API_TOKEN}" ]; then
            if [ -n "${missing}" ]; then
              missing="${missing} and CERBERUS_API_TOKEN"
            else
              missing="CERBERUS_API_TOKEN"
            fi
          fi
          if [ -n "${missing}" ]; then
            echo "::error title=Cerberus not configured::Missing secret(s): ${missing}. Not visible to this repository, so the ${SUITE} failure was NOT reported to Slack. Both are provisioned as repo-level secrets by pulumi-infra (github/repoVariables/resources.yaml, STAC-25533). This job fails rather than passing silently, because a notification path that quietly stops working is worse than a visibly broken one."
            exit 1
          fi

          COMMIT_TITLE=$(printf '%s' "${COMMIT_MESSAGE}" | head -n1)
          if [ -z "${COMMIT_TITLE}" ]; then
            COMMIT_TITLE="${COMMIT_SHA}"
          fi

          # Not --verbose: it echoes request headers, and the Authorization
          # header carries the shared token. GitHub would mask it, but not
          # emitting it is better than relying on masking.
          curl --fail --silent --show-error \
            -X POST "${CERBERUS_LAMBDA_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CERBERUS_API_TOKEN}" \
            -d "$(jq -n \
              --arg repo "${REPOSITORY}" \
              --arg branch "${BRANCH}" \
              --arg pipeline "${PIPELINE}" \
              --arg sha "${COMMIT_SHA}" \
              --arg title "${COMMIT_TITLE}" \
              --arg suite "${SUITE}" \
              '{
                action: "notify",
                context: {
                  platform: "github",
                  "project.id": $repo,
                  "project.slug": $repo,
                  "project.name": "StackState Agent Integrations",
                  branch: $branch,
                  pipeline: $pipeline,
                  "commit.sha": $sha,
                  "commit.title": $title,
                  suite: $suite
                }
              }'
            )"
