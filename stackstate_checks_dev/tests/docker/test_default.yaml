version: '3'

services:

  vault:
    # Docker Hub's official hashicorp/vault. Was pulled through the SUSE
    # Private Registry proxy-cache, which needs credentials this public repo's
    # CI must not hold. Override VAULT_IMAGE to use the proxy on a self-hosted
    # runner.
    image: ${VAULT_IMAGE:-hashicorp/vault:latest}
    container_name: checksdev_vault
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=myroot
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - SKIP_SETCAP=yes
    ports:
      - "8200:8200"
